# Pre-commit hooks configuration
# See https://pre-commit.com for more information
#
# Hook stages:
# - pre-commit: Fast checks on every commit (formatting, syntax, security)
# - pre-push: Full quality checks before pushing (Qlty, full scans)
# - commit-msg: Conventional commit message validation
#
# Installation: curl https://qlty.sh | bash
# Documentation: https://docs.qlty.sh
#
# Canonical hooks are present for: ruff, ruff-format, basedpyright, trufflehog,
# detect-secrets, commitizen, yamllint, markdownlint, interrogate (src + scripts).
# Qlty remains for metric collection on pre-push; canonical hooks provide the
# fail-closed gates on pre-commit.

ci:
  autoupdate_schedule: monthly
  autofix_prs: true
  skip: [validate-front-matter, qlty-check, qlty-full, trufflehog, bandit, bandit-full]  # Skip hooks that require local system tools

repos:
  # ============================================================================
  # Fast File Checks (Lightweight, run on every commit)
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: c4a0b883114b00d8d76b479c820ce7950211c99b  # v4.5.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
        exclude: mkdocs.yml  # Exclude mkdocs.yml due to !ENV custom tags
      - id: check-json
        stages: [pre-commit]
        exclude: ^frontend/tsconfig.*\.json$  # TypeScript configs use JSONC (comments allowed)
      - id: check-toml
        stages: [pre-commit]
      - id: check-added-large-files
        args: ['--maxkb=10000']  # 10MB limit
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]
      - id: mixed-line-ending
        args: ['--fix=lf']
        stages: [pre-commit]
      - id: debug-statements
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]

  # ============================================================================
  # Secret Detection - TruffleHog (primary) + detect-secrets (baseline regression)
  # ============================================================================
  # TruffleHog: staged-files-only scan, fail-closed
  # Excludes: CHANGELOG.md (CVE IDs trigger false positives), uv.lock (package hashes),
  #          .submodules/ (separately scanned)
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: "37b77001d0174ebec2fcca2bd83ff83a6d45a3ab"  # v3.95.3  # pragma: allowlist secret
    hooks:
      - id: trufflehog
        entry: >-
          bash -c 'files=$(git diff --cached -z --name-only --diff-filter=d 2>/dev/null
          | tr "\0" "\n"
          | grep -v "^CHANGELOG\.md$"
          | grep -v "^uv\.lock$"
          | grep -v "^\.submodules/"
          | grep -v "^$");
          [ -z "$files" ] && exit 0;
          printf "%s\0" $files | xargs -0 trufflehog filesystem --fail --no-update'
        pass_filenames: false
        stages: [pre-commit]

  # detect-secrets: baseline regression scan (second-layer)
  - repo: https://github.com/Yelp/detect-secrets
    rev: "01886c8a910c64595c47f186ca1ffc0b77fa5458"  # v1.5.0  # pragma: allowlist secret
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '^(uv\.lock|CHANGELOG\.md|htmlcov/.*|\.standards/.*|.*\.svg|.*\.png|.*\.jpg|.*\.lock)$'
        stages: [pre-commit]

  # ============================================================================
  # Ruff: Linting + Formatting (canonical hooks, PC-002)
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "0c7b6c989466a93942def1f84baf36ddfcd60c83"  # v0.15.14  # pragma: allowlist secret
    hooks:
      - id: ruff
        args: ['--fix']
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  # ============================================================================
  # BasedPyright: Static Type Checking (canonical hook, PC-003)
  # ============================================================================
  # basedpyright has no .pre-commit-hooks.yaml; run via local uv invocation
  - repo: local
    hooks:
      - id: basedpyright
        name: BasedPyright Type Check
        entry: uv run basedpyright src/
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

  # ============================================================================
  # Security Scanning - Bandit
  # ============================================================================
  # Dedicated Bandit hook for Python security analysis
  # Runs on changed files during pre-commit, full scan on pre-push
  # Configuration in pyproject.toml [tool.bandit]
  - repo: https://github.com/PyCQA/bandit
    rev: 36fd65054fc8864b4037d0918904f9331512feb5  # 1.7.10
    hooks:
      - id: bandit
        name: Bandit Security Scan (changed files)
        args: ['-c', 'pyproject.toml', '-ll']  # Medium+ severity only
        stages: [pre-commit]
        exclude: ^(tests|scripts|benchmarks|tools|fuzz)/

  # Full Bandit scan on pre-push (catches all issues before PR)
  - repo: local
    hooks:
      - id: bandit-full
        name: Bandit Security Scan (full src/)
        entry: uv run bandit -c pyproject.toml -r src/ -ll -q
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true

  # ============================================================================
  # Conventional Commits Enforcement
  # ============================================================================
  # Enforces conventional commit message format for semantic versioning
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 406f0d1a4ffcd9eb0be9f0f6b824df619b38f41e  # v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]

  # Commitizen: version bump and conventional commit enforcement (PC-008)
  - repo: https://github.com/commitizen-tools/commitizen
    rev: "953e1ba4599cc3143122ed5c3e8de3d6dfd5524d"  # v4.16.2  # pragma: allowlist secret
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # ============================================================================
  # pyproject.toml Validation
  # ============================================================================
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 78f5e0f104cfa803d0597eaa924b4de3becd3e3e  # v0.24.1 (PEP 735 dependency-groups support)  # pragma: allowlist secret
    hooks:
      - id: validate-pyproject
        stages: [pre-commit]

  # ============================================================================
  # GitHub Workflow Validation
  # ============================================================================
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 4e7291655d44e99511858efd33bea0bdbb58d835  # 0.29.4
    hooks:
      - id: check-github-workflows
        stages: [pre-commit]

  # ============================================================================
  # YAML Linting (canonical hook, PC-009)
  # ============================================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: "cba56bcde1fdd01c1deb3f945e69764c291a6530"  # v1.38.0  # pragma: allowlist secret
    hooks:
      - id: yamllint
        args: ['-c', '.yamllint']
        stages: [pre-commit]

  # ============================================================================
  # Markdown Linting (canonical hook, PC-010)
  # ============================================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: "e72a3ca1632f0b11a07d171449fe447a7ff6795e"  # v0.48.0  # pragma: allowlist secret
    hooks:
      - id: markdownlint
        args: ['--config', '.markdownlint.json']
        stages: [pre-commit]

  # ============================================================================
  # Qlty Unified Quality Checks (Pre-Push)
  # ============================================================================
  # Moved to pre-push to avoid clogging PR reviews with issues
  # Qlty runs all quality tools in a single pass:
  # - Ruff (linting + formatting)
  # - BasedPyright (type checking)
  # - Gitleaks (secrets detection)
  # - Markdownlint (markdown linting)
  # - Yamllint (YAML linting)
  # - OSV Scanner (dependency vulnerabilities)
  # - Code smells and complexity analysis
  #
  # Configure via .qlty/qlty.toml
  # Install: curl https://qlty.sh | bash && qlty plugins install
  - repo: local
    hooks:
      - id: qlty-check
        name: Qlty Code Quality Check (changed files)
        entry: >-
          bash -c "command -v qlty >/dev/null 2>&1 && qlty check --filter=diff || echo 'Qlty not installed - skipping (install: curl https://qlty.sh | bash)'"
        language: system
        types: [file]
        pass_filenames: false
        stages: [pre-push]
        verbose: true

      - id: qlty-full
        name: Qlty Full Quality Check (all files)
        entry: >-
          bash -c "command -v qlty >/dev/null 2>&1 && qlty check src/ || echo 'Qlty not installed - skipping'"
        language: system
        pass_filenames: false
        stages: [pre-push]
        verbose: true


  # ============================================================================
  # Custom Documentation Validation
  # ============================================================================
  - repo: local
    hooks:
      - id: validate-front-matter
        name: Validate documentation front matter
        entry: python tools/validate_front_matter.py docs
        language: python
        files: ^docs/(?!planning/).*\.md$
        pass_filenames: false
        stages: [pre-commit]
        additional_dependencies:
          - python-frontmatter>=1.1.0
          - pydantic>=2.0
          - ruamel.yaml>=0.18

      # Global CLAUDE.md forbids the em-dash character (U+2014) in any output.
      # This hook enforces the rule automatically on every commit.
      - id: no-em-dash
        name: Reject em-dash characters (U+2014)
        entry: python tools/check_no_em_dash.py
        language: python
        types_or: [python, markdown, yaml, toml]
        stages: [pre-commit]


  # ============================================================================
  # Python Docstring Coverage (PC-007 / PC-007b)
  # ============================================================================
  # Two aliased instances cover src/ and scripts/ independently
  - repo: https://github.com/econchick/interrogate
    rev: 4894019dc8876092bc9b6d56878798c550fad998  # 1.7.0  # pragma: allowlist secret
    hooks:
      - id: interrogate
        alias: interrogate-src
        args: ['-v', '-c', 'pyproject.toml', '--fail-under=80', 'src/']
        language_version: python3.12
        pass_filenames: false
        stages: [pre-commit]
      - id: interrogate
        alias: interrogate-scripts
        args: ['-v', '-c', 'pyproject.toml', '--fail-under=85', 'scripts/']
        language_version: python3.12
        pass_filenames: false
        stages: [pre-commit]

  # ============================================================================
  # Docstring Argument Validation
  # ============================================================================
  # Pydoclint validates that docstring arguments match function signatures
  # Configuration in pyproject.toml [tool.pydoclint]
  - repo: https://github.com/jsh9/pydoclint
    rev: 88d83c94156c5e51a09938e77019f2c58e92ab58  # 0.8.4  # pragma: allowlist secret
    hooks:
      - id: pydoclint
        args: ["--config=pyproject.toml"]
        types: [python]
        stages: [pre-commit]
        exclude: ^(tests|scripts|benchmarks|tools)/

# Exclude patterns
exclude: |
  (?x)^(
      \.git/|
      \.venv/|
      venv/|
      build/|
      dist/|
      .*\.egg-info/|
      __pycache__/|
      \.mypy_cache/|
      \.pytest_cache/|
      \.ruff_cache/|
      data/|
      models/|
      .*\.pyc
  )$

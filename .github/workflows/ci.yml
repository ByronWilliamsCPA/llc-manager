# CI/CD Pipeline
# Runs tests, linting, type checking, and security scans.
#
# Features:
#   - Standard quality checks (tests, linting, type checking)
#   - Security scanning (Bandit, Safety)
#   - Optional SonarCloud/Codecov integration
name: CI

on:
  merge_group:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

# Uses org-level reusable workflow
jobs:
  ci:
    name: CI Pipeline
    uses: ByronWilliamsCPA/.github/.github/workflows/python-ci.yml@b7c661ec3bfeb04370ce3a9c748bd8c4e93bfe89 # main
    permissions:
      contents: read
      pull-requests: write
      checks: write
    with:
      python-version: '3.12'
      coverage-threshold: 80
      source-directory: 'src'
      test-directory: 'tests'
      run-integration-tests: true
      run-security-tests: true
      fail-on-llm-tags: false

  # Aggregator job: publishes the bare "CI Gate" status context required by
  # the ByronWilliamsCPA-python-tier-ci-gate ruleset. Reusable-workflow jobs
  # always publish as "<calling-job-name> / <reusable-job-name>" (here:
  # "CI Pipeline / CI Gate"), which cannot match a bare-name ruleset context.
  # This thin local job depends on the reusable workflow call and publishes
  # the required bare name once the underlying gate passes.
  #
  # #CRITICAL: `if: always()` plus the explicit result check is what lets this
  # gate FAIL. A plain `needs:` job is SKIPPED when `ci` fails or is
  # cancelled, and a skipped required check is treated as satisfied by the
  # ruleset and the merge queue, so a broken build would still look green.
  # The gate must therefore always run and exit non-zero unless `ci` is
  # exactly `success`. `skipped` is also a failure on every trigger: `ci` has
  # no `if:` condition, so it runs on pull_request, merge_group, push and
  # workflow_dispatch, and a skip can only mean a misconfigured condition,
  # which must not pass vacuously.
  # #VERIFY: keep `if: always()` and the `!= success` comparison together.
  ci-gate:
    name: CI Gate
    needs: ci
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check CI Pipeline result
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          if [ "$CI_RESULT" != "success" ]; then
            echo "::error::CI Gate failed: CI Pipeline (job ci) result is $CI_RESULT"
            exit 1
          fi
          echo "CI Pipeline succeeded; bare CI Gate context satisfied."

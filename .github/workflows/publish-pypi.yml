# Publish to PyPI - Calls Org-Level Reusable Workflow
# This is a lightweight caller workflow that invokes the organization's
# shared PyPI publishing workflow with OIDC trusted publishing.
#
# Not in standards-manifest.yaml expected set (2026-05-24); justified: PyPI package publishing required for library distribution.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test-pypi:
        description: 'Publish to Test PyPI instead of PyPI'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # Required for OIDC trusted publishing

jobs:
  publish:
    name: Publish Package
    uses: ByronWilliamsCPA/.github/.github/workflows/python-publish-pypi.yml@01bb5747a7e14b480b26ab94123f25f5e591cde2 # main
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing
    with:
      python-version: '3.12'
      package-name: 'llc-manager'
      test-pypi: ${{ github.event.inputs.test-pypi || false }}

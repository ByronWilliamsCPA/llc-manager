---
# Security Analysis Workflow
# Runs security scans including Bandit, Safety, and dependency checks.
#
# Features:
#   - Bandit static analysis for Python
#   - Safety dependency vulnerability scanning
#   - Weekly scheduled scans
name: Security Analysis

"on":
  merge_group:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run security scans weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # Required by the reusable workflow's `codeql` job for SARIF upload
  pull-requests: write     # Required by the reusable workflow's `dependency-review` job
  actions: read            # Required by the reusable workflow's `codeql` job; missing this caused startup_failure

# Uses org-level reusable workflow
jobs:
  # The reusable workflow's internal `Security Gate Validation` job publishes
  # as "Security Analysis / Security Gate Validation". Reusable-workflow check
  # runs always carry the "<calling-job-name> / <reusable-job-name>" prefix,
  # which cannot match the bare "Security Gate Validation" context required by
  # the ByronWilliamsCPA-default-branch-baseline ruleset. The thin
  # `security-gate` job below publishes the required bare name (same pattern
  # as `ci-gate` in ci.yml).
  security:
    name: Security Analysis
    uses: ByronWilliamsCPA/.github/.github/workflows/python-security-analysis.yml@7d12f5486ab5c856397ebaa4acd3c99ca385227c # main
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      actions: read   # required by the reusable workflow's codeql job; omitting it causes startup_failure
    with:
      source-directory: 'src'
      python-version: '3.12'
      fail-on-high: true
      fail-on-medium: false
      run-codeql: true
      run-dependency-review: true
      run-bandit: true
      # Safety disabled: not in this project's dependency tree, so
      # `uv run safety check` fails with `Failed to spawn: safety` and
      # crashes Python Security Scan with exit code 2. OSV Scanner
      # already queries the same OSV.dev + PyPA advisory feeds Safety
      # uses, so coverage is preserved.
      run-safety: false
      run-osv: true

  # #CRITICAL: without `if: always()` this job is SKIPPED whenever `security`
  # fails, and GitHub rulesets treat a skipped required check as satisfied. The
  # gate then reports green on a failed security scan, which is worse than
  # having no gate because branch protection still shows the repo as covered.
  # #VERIFY: `if: always()` and the explicit `needs.security.result` comparison
  # below must both survive any edit to this job.
  security-gate:
    name: Security Gate Validation
    needs: security
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check Security Analysis result
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          if [ "$SECURITY_RESULT" != "success" ]; then
            echo "::error::Security Gate Validation failed: Security Analysis result is $SECURITY_RESULT"
            exit 1
          fi
          echo "Security Analysis succeeded; bare Security Gate Validation context satisfied."

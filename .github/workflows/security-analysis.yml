---
# Security Analysis Workflow
# Runs security scans including Bandit, Safety, and dependency checks.
#
# Features:
#   - Bandit static analysis for Python
#   - Safety dependency vulnerability scanning
#   - Weekly scheduled scans
name: Security Analysis

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run security scans weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # Required by the reusable workflow's `codeql` job for SARIF upload
  pull-requests: write     # Required by the reusable workflow's `dependency-review` job
  actions: read            # Required by the reusable workflow's `codeql` job; missing this caused startup_failure

# Uses org-level reusable workflow
jobs:
  # Calling-job name is set to "Security Analysis" so the reusable workflow's
  # internal `Security Gate Validation` job publishes as
  # "Security Analysis / Security Gate Validation", matching the context name
  # required by the ByronWilliamsCPA-default-branch-baseline ruleset.
  security:
    name: Security Analysis
    uses: ByronWilliamsCPA/.github/.github/workflows/python-security-analysis.yml@e8fc83c98c2971ad1ece71573d28171463e30c16 # main
    with:
      source-directory: 'src'
      python-version: '3.12'
      fail-on-high: true
      fail-on-medium: false
      run-codeql: true
      run-dependency-review: true
      run-bandit: true
      # Safety disabled: not in this project's dependency tree, so
      # `uv run safety check` fails with `Failed to spawn: safety` and
      # crashes Python Security Scan with exit code 2. OSV Scanner
      # already queries the same OSV.dev + PyPA advisory feeds Safety
      # uses, so coverage is preserved.
      run-safety: false
      run-osv: true

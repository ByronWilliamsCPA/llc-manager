# OpenSSF Scorecard for LLC Manager
# Security posture assessment and supply chain security validation.
#
# Dashboard: https://securityscorecards.dev/viewer/?uri=github.com/ByronWilliamsCPA/llc-manager
# Documentation: https://github.com/ossf/scorecard
#
# publish-results is true: results published to api.securityscorecards.dev via OIDC.
# id-token: write is set in the workflow permissions block to enable OIDC publishing.
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly on Tuesdays at 21:21 UTC
    - cron: '21 21 * * 2'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write
  actions: read

# Uses org-level reusable workflow
jobs:
  scorecard:
    name: Scorecard Analysis
    uses: ByronWilliamsCPA/.github/.github/workflows/python-scorecard.yml@7d12f5486ab5c856397ebaa4acd3c99ca385227c  # main
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    with:
      publish-results: true
      upload-sarif: true
      artifact-retention-days: 5
    secrets:
      SCORECARD_TOKEN: ${{ secrets.SCORECARD_TOKEN }}

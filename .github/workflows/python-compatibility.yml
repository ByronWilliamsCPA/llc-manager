# Python Compatibility Matrix Testing for LLC Manager
# Tests the project across multiple Python versions and operating systems.
#
# This is a thin caller to the org-level reusable workflow.
name: Python Compatibility

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
  schedule:
    # Weekly compatibility check on Sundays at 6 AM UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: python-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility:
    name: Python Compatibility Matrix
    uses: ByronWilliamsCPA/.github/.github/workflows/python-compatibility.yml@e8fc83c98c2971ad1ece71573d28171463e30c16 # main
    with:
      python-versions: '["3.12", "3.13"]'
      operating-systems: '["ubuntu-latest"]'
      include-macos: true
      include-windows: true
      source-directory: 'src'
      # Target tests/unit directly: the org reusable workflow runs
      # `uv run $TEST_COMMAND` with unquoted variable expansion, so any
      # marker expression with spaces (e.g. `-m "not slow and not integration"`)
      # is word-split by the shell with embedded quotes kept as literals,
      # producing `ERROR: file or directory not found: slow` in every combo.
      # Directory targeting avoids quoting entirely and excludes
      # tests/integration, tests/fuzz, and tests/test_example.py by path.
      test-command: 'pytest tests/unit -v --tb=short -x'
      coverage-report: false
      fail-fast: false
      timeout-minutes: 30
      # This project uses the hatchling build backend, so the reusable
      # workflow's default `--no-build` (which refuses to build the local
      # editable install) must be disabled.
      no-build: false
    # `secrets: inherit` intentionally omitted below (org reusable workflow uses no secrets).

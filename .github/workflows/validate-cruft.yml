# Validate Cruft - Checks that the project is in sync with the cookiecutter template
# Alerts when the upstream template has changes that have not been applied.
name: Validate Cruft

on:
  schedule:
    # Run weekly on Monday at 6 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.cruft.json'
      - '.github/workflows/validate-cruft.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-cruft:
    name: Check Template Sync
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install cruft
        run: uv tool install cruft==2.15.0

      - name: Check cruft sync status
        run: |
          if ! cruft check; then
            echo "::warning::Project is out of sync with the upstream template."
            echo "Run 'cruft update' locally to apply template updates."
            exit 1
          fi
          echo "Project is in sync with the upstream template."

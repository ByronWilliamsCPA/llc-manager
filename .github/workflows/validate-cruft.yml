# Validate Cruft - Checks that the project is in sync with the cookiecutter template
# Alerts when the upstream template has changes that have not been applied.
name: Validate Cruft

on:
  schedule:
    # Run weekly on Monday at 6 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.cruft.json'
      - '.github/workflows/validate-cruft.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-cruft:
    name: Check Template Sync
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install cruft
        run: uv tool install cruft==2.15.0

      - name: Check cruft sync status
        run: |
          if ! cruft check; then
            echo "::warning::Project is out of sync with the upstream template."
            echo "Run 'cruft update' locally to apply template updates."
            exit 1
          fi
          echo "Project is in sync with the upstream template."

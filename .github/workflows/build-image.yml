# Build, smoke-test, sign, and push the container image to GHCR.
# Runs on merges to main and on manual dispatch (set `push` to false for a
# build and smoke test only).
name: Build Image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to registry (false for a build and smoke test only)'
        required: false
        default: true
        type: boolean

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/byronwilliamscpa/llc-manager

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Compute tags
        id: meta
        env:
          SOURCE_SHA: ${{ github.sha }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          SHA_TAG="sha-${SOURCE_SHA:0:7}"
          TAGS="${IMAGE}:${SHA_TAG}"
          if [ "${IS_MAIN}" = "true" ]; then
            TAGS="${TAGS},${IMAGE}:latest,${IMAGE}:$(date +%Y%m%d)"
          fi
          {
            echo "tags=${TAGS}"
            echo "sha_tag=${SHA_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: llc-manager-smoke:ci
          cache-from: type=gha,scope=llc-manager
          cache-to: type=gha,mode=max,scope=llc-manager

      - name: Smoke test
        run: |
          set -euo pipefail
          cleanup() { docker rm -f llc-manager-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          # Production mode makes the app validate its secret key at startup.
          # The key is generated per run, so no secret literal lives here and
          # it is only ever used inside this throwaway container. The database
          # is never contacted because the liveness probe does not touch it;
          # the host below is a reserved, unresolvable name.
          LLC_MANAGER_SECRET_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::${LLC_MANAGER_SECRET_KEY}"
          export LLC_MANAGER_SECRET_KEY
          docker run -d --name llc-manager-smoke -p 18000:8000 \
            -e LLC_MANAGER_ENVIRONMENT=production \
            -e LLC_MANAGER_SECRET_KEY \
            -e LLC_MANAGER_DATABASE_HOST=db.example.invalid \
            llc-manager-smoke:ci
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:18000/api/health/live >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 2
          done
          if [ -z "${ok}" ]; then
            docker logs llc-manager-smoke || true
            exit 1
          fi
          # The container must not run as root.
          user=$(docker inspect --format '{{.Config.User}}' llc-manager-smoke:ci)
          if [ -z "${user}" ] || [ "${user%%:*}" = "0" ] || [ "${user}" = "root" ]; then
            echo "image runs as root or has no USER set: '${user}'"
            exit 1
          fi
          # The image's own HEALTHCHECK command must also pass.
          docker exec llc-manager-smoke python -c \
            "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/live', timeout=2).status == 200 else 1)"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push == true }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=llc-manager
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Sign image
        if: >-
          github.ref == 'refs/heads/main' &&
          steps.build.outputs.digest != '' &&
          (github.event_name != 'workflow_dispatch' || inputs.push == true)
        env:
          IMAGE_DIGEST_REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_DIGEST_REF}"

      - name: Summary
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          {
            echo "### Container image"
            echo "Image: \`${IMAGE}:${SHA_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

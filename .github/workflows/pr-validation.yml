# PR Validation for LLC Manager
# Supplementary pull request checks: dead code detection, changelog
# enforcement, and documentation links.
#
# The org-level python-pr-validation.yml reusable workflow this file used to
# call has been retired (tombstoned) upstream in ByronWilliamsCPA/.github; it
# now hard-fails on every call. #ASSUME its coverage (lint, type checking,
# tests, security scanning, conventional-commit PR titles) is fully replaced
# by this repo's own ci.yml (CI Gate), security-analysis.yml (Security Gate
# Validation), and pr-title.yml (Validate PR Title), all of which already run
# on the same pull_request events. #VERIFY on the next PR that CI Gate,
# Security Gate Validation, and Validate PR Title all still post and are
# green; if any is missing, re-add an equivalent local check here instead of
# assuming coverage exists. The one core-validation input with no surviving
# equivalent, require-description (minimum PR body length), was dropped
# org-wide by design when python-pr-validation.yml was deprecated (see that
# file's migration header: "PR title and description validation: removed,
# use semantic-release"), so it is intentionally not reintroduced here.
name: PR Validation

on:
  merge_group:
  pull_request:
    # `labeled` / `unlabeled` are required for the changelog-enforcer skip
    # labels (skip-changelog, dependencies, documentation) to take effect
    # after PR creation. Without them, the workflow's frozen event payload
    # never sees label additions, and `gh run rerun` cannot refresh it.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
      - master
      - develop

# Cancel in-progress runs for same PR
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ==========================================================================
  # Additional Checks (Template-Specific)
  # ==========================================================================
  # core-validation (the org-level python-pr-validation.yml call) was removed
  # here: that reusable workflow is a tombstone that now hard-fails on every
  # invocation upstream (ByronWilliamsCPA/.github). Its previously-real
  # coverage is already provided independently by this repo's ci.yml (CI
  # Gate), security-analysis.yml (Security Gate Validation), and pr-title.yml
  # (Validate PR Title); re-adding a second python-ci.yml caller here would
  # just run the same lint/type/test/security suite twice per PR for no new
  # signal. See the workflow-level comment above for the full rationale.

  # Dead Code Detection with Vulture
  dead-code:
    name: Dead Code Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false  # Token must not persist into vulture/uv steps

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install UV
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-local-path: ".uv-cache"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run vulture
        run: |
          echo "## Dead Code Report" >> $GITHUB_STEP_SUMMARY
          uv run vulture src/ --min-confidence 90 | tee vulture-report.txt || true
          if [ -s vulture-report.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat vulture-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "::warning::Potential dead code detected. Review vulture report."
          else
            echo "No dead code detected with 90% confidence." >> $GITHUB_STEP_SUMMARY
          fi

  # Changelog Enforcement
  changelog:
    name: Changelog Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false  # Token must not persist into changelog-enforcer

      - name: Check for CHANGELOG update
        uses: dangoslen/changelog-enforcer@8b5e9dc3121363bb7c0115f8533404d92af382de # v3.7.0
        with:
          changeLogPath: 'CHANGELOG.md'
          skipLabels: 'skip-changelog,dependencies,documentation'
          missingUpdateErrorMessage: |
            Please update CHANGELOG.md with a description of your changes.
            Add the label 'skip-changelog' if this PR doesn't require a changelog entry.


  # Documentation Link Check
  link-check:
    name: Documentation Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false  # Token must not persist into lychee-action

      - name: Check documentation links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,206,301,302,403,429
            --exclude-mail
            --exclude '^https://github.com/.*/(issues|pulls|compare)/.*$'
            --exclude '^https://linear.app/.*$'
            './docs/**/*.md'
            './README.md'
            './CONTRIBUTING.md'
          fail: false
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================================================
  # Dependency & Standards Validation Aggregator
  # ==========================================================================
  # Publishes the bare "Dependency & Standards Validation" status context
  # required by the ByronWilliamsCPA-default-branch-baseline ruleset. This
  # job previously also needed core-validation (the org-level
  # python-pr-validation.yml call), which is now a tombstone that always
  # fails; that need has been dropped so this gate is not permanently red
  # for a reason unrelated to this repo's own code.
  #
  # #ASSUME dead-code remains a real, non-placeholder input: the vulture step
  # itself is advisory only (dead-code findings never fail the job), but the
  # preceding `uv sync --all-extras` step is a genuine dependency-resolution
  # check that fails outright on a broken or inconsistent lockfile/
  # pyproject.toml, and the checkout/setup steps fail on real environment
  # problems. This job is intentionally not expanded to also need `changelog`:
  # that would newly make a missing CHANGELOG.md entry block merges through a
  # required ruleset check, reproducing the exact per-PR changelog/merge-queue
  # conflict pattern the org deprecated elsewhere (per-PR CHANGELOG edits
  # conflict in an ALLGREEN merge queue; the changelog is now generated at
  # release from Conventional Commits instead). Deeper
  # lint/type/test/security coverage is intentionally NOT duplicated here;
  # it is already gated separately and required via ci.yml's CI Gate and
  # security-analysis.yml's Security Gate Validation. #VERIFY that dead-code's
  # `uv sync` step still fails loudly on a broken lockfile if this job's
  # scope changes again.
  dep-std-validation:
    name: Dependency & Standards Validation
    needs: [dead-code]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Confirm dependency and standards gates passed
        run: echo "Dead-code job (dependency install plus standards check) succeeded; bare Dependency & Standards Validation context satisfied for ruleset."

  # ==========================================================================
  # Validation Summary
  # ==========================================================================
  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [dead-code, changelog, link-check]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check validation results
        env:
          DEAD_CODE_RESULT: ${{ needs.dead-code.result }}
          CHANGELOG_RESULT: ${{ needs.changelog.result }}
          LINK_CHECK_RESULT: ${{ needs.link-check.result }}
        run: |
          echo "## PR Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$DEAD_CODE_RESULT" == "success" ]; then
            echo "Dead Code Check: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "Dead Code Check: $DEAD_CODE_RESULT" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$CHANGELOG_RESULT" == "success" ]; then
            echo "Changelog: Updated" >> $GITHUB_STEP_SUMMARY
          elif [ "$CHANGELOG_RESULT" == "skipped" ]; then
            echo "Changelog: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "Changelog: $CHANGELOG_RESULT" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$LINK_CHECK_RESULT" == "success" ]; then
            echo "Link Check: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "Link Check: $LINK_CHECK_RESULT" >> $GITHUB_STEP_SUMMARY
          fi

          # Fail if any blocking validation check failed. `dead-code` is
          # treated as warning-only (it runs vulture which prints advisory
          # output but the job always succeeds), so it is omitted here.
          # `link-check` is also advisory (lychee runs with fail: false in
          # the job above).
          BLOCK=0
          # Changelog: success and skipped (skip-changelog label) both pass.
          case "$CHANGELOG_RESULT" in
            success|skipped) ;;
            *) BLOCK=1 ;;
          esac

          if [ "$BLOCK" = "1" ]; then
            echo ""
            echo "Blocking validation checks failed. Please review and fix issues." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo ""
          echo "All blocking validation checks passed!" >> $GITHUB_STEP_SUMMARY

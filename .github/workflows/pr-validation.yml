# PR Validation for LLC Manager
# Comprehensive pull request validation using org-level workflow plus additional checks.
#
# This workflow calls the org-level PR validation workflow and adds supplementary
# checks for dead code detection and documentation links. Conventional-commit
# PR titles and CHANGELOG generation are handled by pr-title.yml and
# release-time python-semantic-release, respectively.
name: PR Validation

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - master
      - develop

# Cancel in-progress runs for same PR
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ==========================================================================
  # Org-Level PR Validation (Core Checks)
  # ==========================================================================
  core-validation:
    name: Core Validation
    uses: ByronWilliamsCPA/.github/.github/workflows/python-pr-validation.yml@7d12f5486ab5c856397ebaa4acd3c99ca385227c # main
    with:
      python-version: '3.12'
      source-directory: 'src'
      test-directory: 'tests'
      require-tests: true
      require-conventional-commits: true
      require-description: true
      min-description-length: 50
      check-breaking-changes: true
      add-size-labels: true
      coverage-threshold: 80

  # ==========================================================================
  # Additional Checks (Template-Specific)
  # `secrets: inherit` intentionally omitted from core-validation above:
  # the org python-pr-validation reusable workflow references no secrets.
  # ==========================================================================

  # Dead Code Detection with Vulture
  dead-code:
    name: Dead Code Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false  # Token must not persist into vulture/uv steps

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install UV
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-local-path: ".uv-cache"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run vulture
        run: |
          echo "## Dead Code Report" >> $GITHUB_STEP_SUMMARY
          uv run vulture src/ --min-confidence 90 | tee vulture-report.txt || true
          if [ -s vulture-report.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat vulture-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "::warning::Potential dead code detected. Review vulture report."
          else
            echo "No dead code detected with 90% confidence." >> $GITHUB_STEP_SUMMARY
          fi

  # Documentation Link Check
  link-check:
    name: Documentation Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false  # Token must not persist into lychee-action

      - name: Check documentation links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,206,301,302,403,429
            --exclude-mail
            --exclude '^https://github.com/.*/(issues|pulls|compare)/.*$'
            --exclude '^https://linear.app/.*$'
            './docs/**/*.md'
            './README.md'
            './CONTRIBUTING.md'
          fail: false
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================================================
  # Dependency & Standards Validation Aggregator
  # ==========================================================================
  # Publishes the bare "Dependency & Standards Validation" status context
  # required by the ByronWilliamsCPA-default-branch-baseline ruleset. The
  # original job lives in python-pr-validation.yml, but PR #32 migrated this
  # workflow to call python-ci.yml instead, orphaning the gate. This thin
  # aggregator publishes the required bare name once the core CI checks
  # (lint, type, tests, security) and dead-code check both pass, which
  # collectively cover the dependency-and-standards surface area together
  # with the separately-gated reuse.yml workflow. dependency-review.yml was
  # removed (GitHub now bills Advanced Security; the dependency-review
  # action no longer functions).
  dep-std-validation:
    name: Dependency & Standards Validation
    needs: [core-validation, dead-code]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Confirm dependency and standards gates passed
        run: echo "Core validation and dead-code checks succeeded; bare Dependency & Standards Validation context satisfied for ruleset."

  # ==========================================================================
  # Validation Summary
  # ==========================================================================
  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [core-validation, dead-code, link-check]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check validation results
        env:
          CORE_RESULT: ${{ needs.core-validation.result }}
          DEAD_CODE_RESULT: ${{ needs.dead-code.result }}
          LINK_CHECK_RESULT: ${{ needs.link-check.result }}
        run: |
          echo "## PR Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$CORE_RESULT" == "success" ]; then
            echo "Core Validation: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "Core Validation: $CORE_RESULT" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$DEAD_CODE_RESULT" == "success" ]; then
            echo "Dead Code Check: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "Dead Code Check: $DEAD_CODE_RESULT" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$LINK_CHECK_RESULT" == "success" ]; then
            echo "Link Check: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "Link Check: $LINK_CHECK_RESULT" >> $GITHUB_STEP_SUMMARY
          fi

          # Fail if any blocking validation check failed. `dead-code` is
          # treated as warning-only (it runs vulture which prints advisory
          # output but the job always succeeds), so it is omitted here.
          # `link-check` is also advisory (lychee runs with fail: false in
          # the job above).
          BLOCK=0
          [ "$CORE_RESULT" != "success" ] && BLOCK=1

          if [ "$BLOCK" = "1" ]; then
            echo ""
            echo "Blocking validation checks failed. Please review and fix issues." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo ""
          echo "All blocking validation checks passed!" >> $GITHUB_STEP_SUMMARY

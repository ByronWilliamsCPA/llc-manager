# The org container-security workflow (python-container-security.yml) requires
# this format: every entry needs a statement and an expired_at revisit date that
# is in the future and no more than 90 days out. Trivy stops honoring an entry
# once its expired_at has passed, so a lapsed entry fails the scan until it is
# reassessed. Each entry is documented in docs/known-vulnerabilities.md; keep
# the expired_at here equal to that entry's "Reassess by" date.
#
# Passed explicitly to Trivy as --ignorefile .trivyignore.yaml (Trivy does not

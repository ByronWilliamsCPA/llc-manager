<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}LLC Manager{% endblock %}</title>

  <!-- Tailwind CSS (built via standalone CLI) -->
  <link rel="stylesheet" href="/static/css/output.css" />

  <!-- HTMX: declarative server interactions via HTML attributes -->
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>

  <!-- Alpine.js: lightweight client-side reactivity (dropdowns, toggles) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js" integrity="sha384-X9kJyAubVxnP0hcA+AMMs21U445qsnqhnUF8EBlEpP3a42Kh/JwWjlv2ZcvGfphb" crossorigin="anonymous"></script> <!-- pragma: allowlist secret -->

  {% block head %}{% endblock %}
</head>
<body class="h-full" hx-boost="true">

  <!-- Navigation -->
  <nav class="bg-brand-600 text-white shadow-sm">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex h-16 items-center justify-between">
        <div class="flex items-center gap-8">
          <a href="/" class="text-lg font-semibold tracking-tight">LLC Manager</a>
          <div class="hidden sm:flex gap-6 text-sm font-medium">
            <a href="/entities" class="hover:text-brand-100 transition-colors">Entities</a>
            <a href="/documents" class="hover:text-brand-100 transition-colors">Documents</a>
            <a href="/compliance" class="hover:text-brand-100 transition-colors">Compliance</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Flash messages -->
  {% if messages %}
  <div id="flash-messages" class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 mt-4 space-y-2">
    {% for category, message in messages %}
    <div class="rounded-md px-4 py-3 text-sm
      {% if category == 'error' %}bg-red-50 text-red-800 border border-red-200
      {% elif category == 'success' %}bg-green-50 text-green-800 border border-green-200
      {% else %}bg-blue-50 text-blue-800 border border-blue-200{% endif %}">
      {{ message }}
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <!-- Page content -->
  <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>

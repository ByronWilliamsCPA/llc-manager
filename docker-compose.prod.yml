# Production overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  app:
    # Production image (pre-built)
    # image: ghcr.io/ByronWilliamsCPA/llc_manager:${VERSION:-latest}

    # Don't mount source code in production
    volumes: []

    environment:
      ENVIRONMENT: production
      # The app reads the prefixed name first; set both so neither spelling
      # can leave the container looking like development.
      LLC_MANAGER_ENVIRONMENT: production
      LLC_MANAGER_SECRET_KEY: ${LLC_MANAGER_SECRET_KEY:?set a 32+ character random key}
      LLC_MANAGER_API_KEY: ${LLC_MANAGER_API_KEY:?set the API key}
      JSON_LOGS: "true"
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}

    # Production replicas (for load balancing)
    deploy:
      replicas: ${REPLICAS:-2}
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first

  db:
    # Production database settings
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in production}

    # Increased connection pool
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

# =============================================================================
# Production Usage
# =============================================================================
# 1. Set environment variables in .env file or export them:
#    export DB_PASSWORD=secure-production-password
#    export LLC_MANAGER_SECRET_KEY="$(openssl rand -hex 32)"
#    export LLC_MANAGER_API_KEY=your-service-api-key-32-or-more-characters
#    export SENTRY_DSN=your-sentry-dsn
#    export VERSION=v1.0.0
#
# 2. Start services:
#    docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 3. Scale application:
#    docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --scale app=3
#
# 4. Monitor:
#    docker-compose -f docker-compose.yml -f docker-compose.prod.yml logs -f
